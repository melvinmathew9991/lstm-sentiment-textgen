name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch only)
        working-directory: pytorch
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Verify no GPU wheels were pulled
        run: python -c "import torch; assert '+cu' not in torch.__version__, torch.__version__; print(torch.__version__)"

      - name: Test
        working-directory: pytorch
        # -m "" overrides the default marker filter so the `slow` tests, which
        # actually train, run in CI rather than being silently skipped.
        run: pytest -v -m ""

      - name: CLI smoke
        working-directory: pytorch
        run: |
          python -m lstm_nlp.cli --help
          lstm-nlp --version

  audit:
    name: project audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the audit inspects commit messages and tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: pytorch
        run: |
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: End-to-end project audit
        working-directory: pytorch
        run: python scripts/audit.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Blocking from Phase 9 (Rules.md section 9). The tree is clean, so the
      # next finding is new drift rather than accumulated debt.
      - run: ruff check pytorch/ --output-format=github
      # Formatting stays advisory. `ruff format` would rewrite 31 hand-laid-out
      # files -- aligned tables, deliberate line breaks in measured output --
      # for no correctness gain. Adopting a formatter is a decision to take on
      # purpose, not a side effect of turning lint on.
      - run: ruff format --check pytorch/ || true
