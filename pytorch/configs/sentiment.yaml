# Sentiment classification -- many-to-one LSTM over airline tweets.
# Relative paths resolve against THIS FILE's directory (pytorch/configs/).

task: sentiment
seed: 42
device: auto

data:
  csv: ../../data/airline_sentiment.csv
  test_size: 0.30
  val_size: 0.15         # of the TRAIN block: selection needs a set that is not test
  split_seed: 10          # pinned to match the frozen TF reference
  stratify: true          # PRD FR-6
  deduplicate: true       # 2.34% of rows are repeats; see PRD FR-6
  min_freq: 2             # 9,566 train vocab -> 4,505 kept; 5.23% test OOV
  max_len: 30             # p99 = 30 tokens, max = 35

model:
  embed_dim: 64
  hidden_dim: 64
  num_layers: 2
  dropout: 0.3            # between LSTM layers

train:
  batch_size: 64
  epochs: 40
  lr: 1.0e-3
  weight_decay: 0.0
  clip_grad_norm: 5.0
  class_weighting: balanced   # 3.884:1 negative:positive -- PRD FR-14, fixes D4
  num_workers: 0
  early_stopping:
    monitor: val_macro_f1     # NOT accuracy: baseline accuracy is already 0.795
    mode: max
    patience: 5
    min_delta: 0.0

output:
  dir: ../runs/sentiment
