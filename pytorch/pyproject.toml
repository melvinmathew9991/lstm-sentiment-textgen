[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-nlp"
version = "0.1.0"
description = "Many-to-one LSTMs for sentiment detection and text generation (PyTorch)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
lstm-nlp = "lstm_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:lstm_nlp.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lstm_nlp"]
